<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    
    <header>
        <h1>Order from Cluck Norris</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <form>
            <label for="name">Your name</label>
            <input type="text" id="name" name="name">

            <label for="email">Email</label>
            <input type="mail" id="email" name="email">

            <label for="quantity">How many</label>
            <input type="number" id="quantity" name="quantity" min="1" max="20">

            <fieldset>
                <legend>Heat Level</legend>

                <input type="radio" id="mild" name="heat" value="mild">
                <label for="mild">Mild</label>
                
                <input type="radio" id="hot" name="heat" value="hot">
                <label for="hot">Hot</label>

                <input type="radio" id="nashville" name="heat" value="nashville">
                <label for="nashville">Nashville</label>
            </fieldset>

            <label for="pickup">Pickup Time</label>
            <select id="pickup" name="pickup">
                <option value="11">11:00</option>
                <option value="12">12:00</option>
                <option value="1">1:00</option>
            </select>

            <label for="notes">Special Instructions</label>
            <textarea id="notes" name="notes" rows="4" placeholder="Enter text here"></textarea>

            <input type="checkbox" id="sauce" name="sauce">
            <label for="sauce">Extra Sauce</label>

            <button type="submit">Place Order</button>
        </form>
    </main>


</body>
</html>
